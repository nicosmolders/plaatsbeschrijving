<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Plaatsbeschrijving</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, sans-serif; background: #f0eff5; color: #1a1a2e; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

#topbar { background: #2b2bd4; color: #fff; padding: 13px 16px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
#topbar button { background: rgba(255,255,255,.2); color: #fff; border: none; border-radius: 20px; padding: 6px 14px; font-size: 13px; cursor: pointer; }
#topbar-title { font-size: 16px; font-weight: 600; flex: 1; text-align: center; }

#main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; background: #fff; padding: 20px 18px; }

.form-group { margin-bottom: 16px; }
.form-label { font-size: 13px; font-weight: 600; color: #666; margin-bottom: 6px; display: block; }
input, textarea, select { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; font-family: inherit; outline: none; }
input:focus, textarea:focus, select:focus { border-color: #2b2bd4; background: #eeeeff; }
textarea { resize: none; min-height: 80px; }

.btn { display: inline-flex; align-items: center; gap: 8px; padding: 11px 18px; border-radius: 8px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; }
.btn-primary { background: #2b2bd4; color: #fff; }
.btn-primary:active { background: #1e1e9e; }
.btn-secondary { background: #f0eff5; color: #2b2bd4; border: 1.5px solid #2b2bd4; }
.btn-secondary:active { background: #eeeeff; }

.tile-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 12px 0; }
.tile { padding: 12px; border-radius: 8px; border: 2px solid #ddd; text-align: center; cursor: pointer; font-size: 13px; font-weight: 600; background: #fff; transition: .1s; }
.tile.selected { border-color: #2b2bd4; background: #2b2bd4; color: #fff; }

.element-grid { display: grid; grid-template-columns: 1fr; gap: 0; }
.element-row { padding: 14px 0; border-bottom: 1px solid #f0eff5; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
.element-row:active { color: #2b2bd4; }
.element-status { display: flex; align-items: center; gap: 8px; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: #ddd; }
.status-dot.filled { background: #2e9e6b; }

.photo-grid { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
.photo-item { position: relative; }
.photo-thumb { width: 80px; height: 80px; border-radius: 8px; object-fit: cover; border: 1px solid #ddd; cursor: pointer; display: block; }
.photo-num { position: absolute; bottom: 4px; left: 4px; background: #fff; padding: 2px 6px; border-radius: 4px; font-size: 9px; color: #666; font-weight: 600; }
.photo-del { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; background: #fff; border: 1px solid #ddd; font-size: 12px; cursor: pointer; color: #999; display: flex; align-items: center; justify-content: center; }

#lightbox { display: none; position: fixed; inset: 0; background: rgba(240,239,245,.97); z-index: 999; flex-direction: column; }
#lightbox.active { display: flex; }
#lb-header { background: #2b2bd4; color: #fff; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
#lb-canvas-container { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 10px; }
#lb-canvas { max-width: 100%; max-height: 100%; cursor: crosshair; border-radius: 8px; }
#lb-note { padding: 8px 14px; }
#lb-note input { width: 100%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 20px; font-size: 13px; }
#lb-tools { display: flex; gap: 8px; padding: 8px 14px; background: #fff; border-top: 1px solid #f0f0f0; flex-wrap: wrap; }
.tool-btn { padding: 6px 12px; border-radius: 16px; border: 1.5px solid #ddd; background: #fff; cursor: pointer; font-size: 13px; }
.tool-btn.active { border-color: #2b2bd4; background: #2b2bd4; color: #fff; }
.color-btn { width: 22px; height: 22px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; flex-shrink: 0; }
.color-btn.active { border-color: #333; }

.report { font-family: Georgia, serif; color: #111; }
.report h1 { font-size: 16px; font-weight: 700; text-align: center; margin-bottom: 4px; }
.report-info { text-align: center; font-size: 12px; color: #555; border-bottom: 2px solid #111; padding-bottom: 14px; margin-bottom: 20px; }
.report-room { margin-bottom: 24px; }
.report-room-title { font-size: 14px; font-weight: 700; border-bottom: 1px solid #ccc; padding-bottom: 3px; margin-bottom: 10px; }
.report-element { margin-bottom: 10px; }
.report-element-name { font-size: 13px; font-weight: 700; text-decoration: underline; }
.report-photos { font-size: 11px; color: #666; margin-left: 6px; }
.report-bullets { list-style: disc; padding-left: 18px; margin-top: 4px; }
.report-bullets li { font-size: 13px; margin-bottom: 2px; }
.report-no-comment { font-size: 13px; color: #888; font-style: italic; margin-top: 3px; }
.report-photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
.report-photo-item img { width: 100%; border-radius: 4px; border: 1px solid #ddd; }
.report-photo-caption { font-size: 10px; color: #666; margin-top: 3px; font-family: -apple-system, sans-serif; line-height: 1.3; }

.card-big { background: #dde8f8; color: #1a1a2e; border-radius: 12px; padding: 12px 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; text-align: center; min-height: 90px; }
.card-big:active { background: #b8d0f0; }
.nav-item { padding:10px 20px;color:rgba(255,255,255,.75);font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:10px;transition:background .15s; }
.nav-item:hover { background:rgba(255,255,255,.1);color:#fff; }
.nav-item.active { background:rgba(255,255,255,.15);color:#fff;font-weight:700; }
.spacer { margin-bottom: 20px; }

@media print {
  body { background: #fff; height: auto; overflow: visible; }
  #topbar, #lb-tools, #lb-note, #lb-header { display: none !important; }
  #main { overflow: visible; padding: 0; }
  .report { font-family: Georgia, serif; }
  .report-photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .report-photo-item img { width: 100%; border-radius: 4px; border: 1px solid #ddd; page-break-inside: avoid; }
  .report-room { page-break-inside: avoid; }
  img { max-width: 100%; }
}
</style>
</head>
<body>

<!-- Sidebar layout wrapper -->
<div id="app-shell" style="display:flex;height:100vh;overflow:hidden;">

  <!-- Sidebar -->
  <div id="sidebar" style="display:none;width:200px;background:#2b2bd4;flex-shrink:0;flex-direction:column;overflow:hidden;">
    <!-- Logo -->
    <div style="padding:24px 20px 16px;border-bottom:1px solid rgba(255,255,255,.12);">
      <div style="display:flex;align-items:center;gap:10px;">
        <div style="width:32px;height:32px;background:rgba(255,255,255,.2);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;">📋</div>
        <div style="color:#fff;font-size:14px;font-weight:700;line-height:1.2;">Plaatsbeschrijving</div>
      </div>
    </div>
    <!-- Nieuwe inspectie knop -->
    <div style="padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.12);">
      <button onclick="createNieuwDossier();" style="width:100%;background:rgba(255,255,255,.15);color:#fff;border:1.5px solid rgba(255,255,255,.3);border-radius:8px;padding:9px 12px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;">
        <span style="font-size:16px;">+</span> Nieuwe Inspectie
      </button>
    </div>
    <!-- Nav items -->
    <nav style="padding:12px 0;flex:1;">
      <div id="nav-inspecties" class="nav-item active" onclick="switchDashTab('inspecties');">📋 Inspecties</div>
      <div id="nav-facturatie" class="nav-item" onclick="switchDashTab('facturatie');">💶 Facturatie</div>
      <div id="nav-bedrijf" class="nav-item" onclick="switchDashTab('bedrijf');">🏢 Mijn Bedrijf</div>
    </nav>
    <!-- Import/Export onderaan -->
    <div style="padding:14px 16px;border-top:1px solid rgba(255,255,255,.12);">
      <label style="display:flex;align-items:center;gap:8px;color:rgba(255,255,255,.7);font-size:12px;cursor:pointer;padding:6px 0;">
        📂 Importeren<input type="file" accept=".json" onchange="importDashboardJSON(this);" style="display:none;">
      </label>
      <div style="color:rgba(255,255,255,.7);font-size:12px;cursor:pointer;padding:6px 0;" onclick="exportDashboardJSON();">💾 Exporteren</div>
    </div>
  </div>

  <!-- Main area: topbar + content -->
  <div style="flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;">
    <div id="topbar">
      <button id="back-btn">‹ Terug</button>
      <div id="topbar-title">Plaatsbeschrijving</div>
      <div id="topbar-right"></div>
    </div>
    <div id="main"></div>
  </div>
</div>

<!-- Permanente camera input buiten #main zodat render() hem nooit overschrijft -->
<input type="file" id="global-camera" accept="image/*" capture="environment" style="position:fixed;top:-200px;left:-200px;opacity:0;pointer-events:none;">

<!-- Camera overlay: statische label, altijd aanwezig -->
<div id="camera-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:998;flex-direction:column;align-items:center;justify-content:center;gap:24px;">
  <div id="cam-count" style="color:#fff;font-size:16px;font-weight:600;text-align:center;">Tik op de knop om een foto te nemen</div>
  <label id="cam-label" style="width:100px;height:100px;border-radius:50%;background:#fff;border:5px solid #2b2bd4;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:40px;">
    📷<input id="cam-input" type="file" accept="image/*" capture="environment" style="display:none;">
  </label>
  <button onclick="closeCamera();" style="background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:24px;padding:12px 32px;font-size:16px;cursor:pointer;">✓ Klaar</button>
</div>

<div id="lightbox">
  <div id="lb-header">
    <div id="lb-title" style="font-size: 12px; font-weight: 600;"></div>
    <button id="lb-save" style="background: rgba(255,255,255,.2); color: #fff; border: none; border-radius: 16px; padding: 5px 14px; cursor: pointer; font-size: 13px;">Opslaan</button>
  </div>
  <div id="lb-canvas-container"><canvas id="lb-canvas"></canvas></div>
  <div id="lb-note"><input id="lb-note-input" placeholder="Opmerking..."></div>
  <div id="lb-tools">
    <button class="tool-btn active" data-tool="pen">✏️ Pen</button>
    <button class="tool-btn" data-tool="marker">🖊️ Marker</button>
    <button class="tool-btn" data-tool="eraser">🧹 Gum</button>
    <button id="lb-undo" onclick="undoLightbox();" style="background:#f0f0f5;border:none;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;" title="Ongedaan maken">↩️ Undo</button>
    <div style="flex: 1;"></div>
    <div class="color-btn" data-color="#1a1a2e" style="background: #1a1a2e;"></div>
    <div class="color-btn" data-color="#2b2bd4" style="background: #2b2bd4;"></div>
    <div class="color-btn" data-color="#2e9e6b" style="background: #2e9e6b;"></div>
    <div class="color-btn" data-color="#c9a84c" style="background: #c9a84c;"></div>
    <div class="color-btn active" data-color="#d42b2b" style="background: #d42b2b;"></div>
  </div>
</div>

function saveDossier() {
  APP.dossier.adres = document.getElementById('f-adres').value;
  APP.dossier.nr = document.getElementById('f-nr')?.value || '';
  APP.dossier.bus = document.getElementById('f-bus')?.value || '';
  APP.dossier.postcode = document.getElementById('f-pc').value;
  APP.dossier.gemeente = document.getElementById('f-gem').value;
  APP.dossier.type = document.getElementById('f-type').value;
  APP.dossier.datum = document.getElementById('f-datum').value;
  APP.dossier.expert = document.getElementById('f-expert').value;
  APP.dossier.huurders = APP.dossier.huurders.map((h, i) => ({
    naam:   document.getElementById(`f-huurder-naam-${i}`)?.value   || h.naam,
    straat: document.getElementById(`f-huurder-straat-${i}`)?.value || h.straat || '',
    nr:     document.getElementById(`f-huurder-nr-${i}`)?.value     || h.nr || '',
    bus:    document.getElementById(`f-huurder-bus-${i}`)?.value    || h.bus || '',
    pc:     document.getElementById(`f-huurder-pc-${i}`)?.value     || h.pc || '',
    gem:    document.getElementById(`f-huurder-gem-${i}`)?.value    || h.gem || '',
    tel:    document.getElementById(`f-huurder-tel-${i}`)?.value    || h.tel,
    email:  document.getElementById(`f-huurder-email-${i}`)?.value  || h.email,
    adres:  (document.getElementById(`f-huurder-straat-${i}`)?.value || h.straat || '') + ' ' +
            (document.getElementById(`f-huurder-nr-${i}`)?.value || h.nr || ''),
  }));
  APP.dossier.verhuurders = APP.dossier.verhuurders.map((v, i) => ({
    naam:   document.getElementById(`f-verhuurder-naam-${i}`)?.value   || v.naam,
    straat: document.getElementById(`f-verhuurder-straat-${i}`)?.value || v.straat || '',
    nr:     document.getElementById(`f-verhuurder-nr-${i}`)?.value     || v.nr || '',
    bus:    document.getElementById(`f-verhuurder-bus-${i}`)?.value    || v.bus || '',
    pc:     document.getElementById(`f-verhuurder-pc-${i}`)?.value     || v.pc || '',
    gem:    document.getElementById(`f-verhuurder-gem-${i}`)?.value    || v.gem || '',
    tel:    document.getElementById(`f-verhuurder-tel-${i}`)?.value    || v.tel,
    email:  document.getElementById(`f-verhuurder-email-${i}`)?.value  || v.email,
    adres:  (document.getElementById(`f-verhuurder-straat-${i}`)?.value || v.straat || '') + ' ' +
            (document.getElementById(`f-verhuurder-nr-${i}`)?.value || v.nr || ''),
  }));
  APP.dossier.contract.datumOndertekening = document.getElementById('f-contract-ondertekening').value;
  APP.dossier.contract.datumIngang = document.getElementById('f-contract-ingang').value;
}

function voltooidInspectie() {
  // Sla op en zet status op uitgevoerd
  saveDossierToCurrentEntry();
  const entry = DASHBOARD.dossiers.find(d => d.id === _currentDossierId);
  if (entry) {
    entry.status.uitgevoerd = true;
    entry.appData = JSON.parse(JSON.stringify(APP));
  }

  // Stuur webhook naar Wix
  const huurderEmails = APP.dossier.huurders.map(h => h.email).filter(e => e).join(',');
  const verhuurderEmails = APP.dossier.verhuurders.map(v => v.email).filter(e => e).join(',');
  const adres = `${APP.dossier.adres} ${APP.dossier.nr||''}, ${APP.dossier.postcode} ${APP.dossier.gemeente}`.trim();

  const webhookData = {
    adres: adres,
    huurderEmails: huurderEmails,
    verhuurderEmails: verhuurderEmails,
    verslagData: {
      dossier: APP.dossier,
      overzicht: APP.overzicht,
      kamers: APP.kamers.map(k => ({ naam: k.naam, data: k.data })),
    }
  };

  // Webhook URL — vervang door jouw Wix site webhook URL na publiceren
  const WEBHOOK_URL = 'https://www.inplaatsbeschrijvingen.be/_functions/verslagWebhook';

  fetch(WEBHOOK_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(webhookData)
  })
  .then(r => r.json())
  .then(data => {
    if (data.success && entry) {
      entry.status.portaalLink = data.portaalLink;
      entry.status.verslagCode = data.code;
    }
  })
  .catch(err => console.log('Webhook fout:', err));

  // Bevestigingsmodal
  const modal = document.createElement('div');
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;';
  modal.innerHTML = `<div style="background:#fff;border-radius:12px;padding:28px;max-width:360px;width:100%;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.2);">
    <div style="font-size:48px;margin-bottom:12px;">✅</div>
    <h3 style="font-size:18px;font-weight:700;margin-bottom:8px;color:#1a1a2e;">Inspectie voltooid!</h3>
    <p style="font-size:13px;color:#666;margin-bottom:20px;">Het dossier is opgeslagen en emails worden verstuurd naar huurder en verhuurder.</p>

function renderDetail() {
  const kamer = APP.kamers[APP.currentKamer];
  const el = kamer.data[APP.currentElement];
  const idx = ELEMENTEN.indexOf(APP.currentElement);
  const prevEl = idx > 0 ? ELEMENTEN[idx - 1] : null;
  const nextEl = idx < ELEMENTEN.length - 1 ? ELEMENTEN[idx + 1] : null;
  const fotoNrs = el.fotos.map(f => f.nr).join(', ');
  
  let html = `
    <div style="max-width: 600px;">
      <div style="display: flex; justify-content: space-between; margin-bottom: 16px;">
        <button class="btn btn-secondary" onclick="APP.currentElement = '${prevEl}'; render();" ${!prevEl ? 'disabled' : ''} style="font-size: 13px;">← ${prevEl || ''}</button>
        <button class="btn btn-secondary" onclick="APP.currentElement = '${nextEl}'; render();" ${!nextEl ? 'disabled' : ''} style="font-size: 13px;">${nextEl || ''} →</button>
      </div>
      <h2 style="font-size: 20px; font-weight: 700; margin-bottom: 12px;">
        ${APP.currentElement}
        ${fotoNrs ? `<span style="font-size: 13px; font-weight: 400; color: #888; margin-left: 8px;">Foto's: ${fotoNrs}</span>` : ''}
      </h2>
      <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 16px; cursor: pointer;" id="toggle-geen" onclick="toggleGeen();">
        <div style="width: 20px; height: 20px; border-radius: 50%; border: 2px solid #ddd; display: flex; align-items: center; justify-content: center; flex-shrink: 0;" id="radio-geen">
          ${el.geen ? '<div style="width: 10px; height: 10px; border-radius: 50%; background: #2b2bd4;"></div>' : ''}
        </div>
        <span>Geen opmerkingen</span>
      </div>
      ${!el.geen ? `
        <div class="form-group">
          <label class="form-label">Beschrijving</label>
          <div id="f-beschr"
            contenteditable="true"
            style="width:100%;min-height:80px;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;font-family:inherit;outline:none;line-height:1.6;background:#fff;"
            onfocus="this.style.borderColor='#2b2bd4';this.style.background='#eeeeff';"
            onblur="this.style.borderColor='#ddd';this.style.background='#fff';saveBeschr();"
          >${el.beschrijving ? el.beschrijving.split('\\n').filter(l=>l.trim()).map(l=>`<div>• ${l.trim()}</div>`).join('') : '<div><br></div>'}</div>
        </div>
      ` : ''}
      <label class="form-label" style="margin-top: 20px;">Foto's</label>
      <div id="photo-grid-container" class="photo-grid">${el.fotos.map((f, i) => `
        <div class="photo-item">
          <img class="photo-thumb" src="${f.src}" onclick="openLightbox(${APP.currentKamer}, '${APP.currentElement}', ${i});">
          <div class="photo-num">${f.nr}</div>
          <button class="photo-del" onclick="deletePhoto(${i});">×</button>
        </div>
      `).join('')}</div>
      <div style="margin-bottom: 16px;">
        <button class="btn btn-secondary" onclick="triggerCamera();" style="cursor:pointer;">📷 Camera</button>
      </div>
    </div>
  `;
  document.getElementById('main').innerHTML = html;
  const descr = document.getElementById('f-beschr');
  if (descr) {
    // Save helper: strip bullets, store as newline-separated text
    window.saveBeschr = function() {
      const lines = [];
      descr.querySelectorAll('div, p').forEach(el => {
        const t = el.innerText.replace(/^[•·\-]\s*/, '').trim();
        if (t) lines.push(t);
      });
      // Also handle plain text without divs
      if (lines.length === 0 && descr.innerText.trim()) {
        descr.innerText.split('\n').forEach(l => { const t = l.replace(/^[•·\-]\s*/, '').trim(); if (t) lines.push(t); });
      }
      kamer.data[APP.currentElement].beschrijving = lines.join('\n');
    };

    // On Enter: insert bullet div instead of default
    descr.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        // Insert a new div with bullet
        const sel = window.getSelection();
        if (!sel.rangeCount) return;
        const range = sel.getRangeAt(0);
        range.deleteContents();
        const newDiv = document.createElement('div');
        newDiv.textContent = '• ';
        // Place cursor at end of new div
        range.insertNode(newDiv);
        // Move cursor to end of newDiv
        const newRange = document.createRange();
        newRange.setStart(newDiv, newDiv.childNodes.length);
        newRange.collapse(true);
        sel.removeAllRanges();
        sel.addRange(newRange);
      }
    });

    // Ensure first line gets a bullet on first input if empty
    descr.addEventListener('focus', () => {
      if (descr.innerText.trim() === '') {
        descr.innerHTML = '<div>• </div>';
        const range = document.createRange();
        const div = descr.querySelector('div');
        range.setStart(div.firstChild, 2);
        range.collapse(true);
        window.getSelection().removeAllRanges();
        window.getSelection().addRange(range);
      }
    });
  }
  // no f-camera input anymore, using triggerCamera()
}

let _cameraCallback = null;

function triggerCamera() { _triggerCameraFor(addPhotos); }

function triggerSleutelOverzichtCamera() { _triggerCameraFor(addSleutelOverzichtFotos); }

function addPhotos(files) {
  const el = APP.kamers[APP.currentKamer].data[APP.currentElement];
  Array.from(files).forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      el.fotos.push({ src: e.target.result, nr: APP.fotoCounter++, note: '' });
      updatePhotoGrid();
    };
    reader.readAsDataURL(file);
  });
}

function updatePhotoGrid() {
  const el = APP.kamers[APP.currentKamer].data[APP.currentElement];
  const fotoNrs = el.fotos.map(f => f.nr).join(', ');
  const titleEl = document.querySelector('#main h2');
  if (titleEl) {
    const span = titleEl.querySelector('span');
    if (fotoNrs) {
      if (span) span.textContent = `Foto's: ${fotoNrs}`;
      else titleEl.insertAdjacentHTML('beforeend', `<span style="font-size:13px;font-weight:400;color:#888;margin-left:8px;">Foto's: ${fotoNrs}</span>`);
    }
  }
  const grid = document.getElementById('photo-grid-container');
  if (grid) {
    grid.innerHTML = el.fotos.map((f, i) => `
      <div class="photo-item">
        <img class="photo-thumb" src="${f.src}" onclick="openLightbox(${APP.currentKamer}, '${APP.currentElement}', ${i});">
        <div class="photo-num">${f.nr}</div>
        <button class="photo-del" onclick="deletePhoto(${i});">×</button>
      </div>`).join('');
  }
}

function deletePhoto(idx) {
  APP.kamers[APP.currentKamer].data[APP.currentElement].fotos.splice(idx, 1);
  updatePhotoGrid();
}

function toggleGeen() {
  const el = APP.kamers[APP.currentKamer].data[APP.currentElement];
  el.geen = !el.geen;
  if (el.geen) el.beschrijving = '';
  render();
}

function openLightbox(kamarIdx, element, idx) {
  LIGHTBOX_DATA = { kamarIdx, element, index: idx };
  const el = APP.kamers[kamarIdx].data[element];
  const foto = el.fotos[idx];
  document.getElementById('lb-title').textContent = `${foto.nr}. ${APP.kamers[kamarIdx].naam} – ${element}`;
  document.getElementById('lb-note-input').value = foto.note || '';
  document.getElementById('lightbox').classList.add('active');
  initLightboxCanvas(foto.src);
}

document.getElementById('lb-save').onclick = () => {
  const canvas = document.getElementById('lb-canvas');
  const newSrc = canvas.toDataURL('image/jpeg', 0.92);
  const note = document.getElementById('lb-note-input').value;
  const ld = LIGHTBOX_DATA;

  if (ld.type === 'voorgevel') {
    APP.overzicht.fotoVoorgevel = newSrc;
  } else if (ld.type === 'sleutel-overzicht') {
    APP.sleutels.fotos[ld.index].src = newSrc;
    APP.sleutels.fotos[ld.index].note = note;
  } else if (ld.type === 'sleutel-item') {
    APP.sleutels.items[ld.sleutelIdx].fotos[ld.index].src = newSrc;
    APP.sleutels.items[ld.sleutelIdx].fotos[ld.index].note = note;
  } else if (ld.type === 'meter-overzicht') {
    APP.meters.fotos[ld.index].src = newSrc;
    APP.meters.fotos[ld.index].note = note;
  } else if (ld.type === 'meter-item') {
    APP.meters.items[ld.meterIdx].fotos[ld.index].src = newSrc;
    APP.meters.items[ld.meterIdx].fotos[ld.index].note = note;
  } else if (ld.type === 'exterieur-overzicht') {
    APP.exterieur.fotos[ld.index].src = newSrc;
    APP.exterieur.fotos[ld.index].note = note;
  } else if (ld.type === 'exterieur-detail') {
    APP.exterieur.items[ld.extIdx].fotos[ld.index].src = newSrc;
    APP.exterieur.items[ld.extIdx].fotos[ld.index].note = note;
  } else {
    const el = APP.kamers[ld.kamarIdx].data[ld.element];
    el.fotos[ld.index].src = newSrc;
    el.fotos[ld.index].note = note;
  }
  document.getElementById('lightbox').classList.remove('active');
  render();
};

    ${bedrijfsnaam ? `<div style="font-size:13px;font-weight:700;margin-bottom:4px;">${bedrijfsnaam}</div>` : ''}

  html += `<div style="margin-bottom: 20px; border-bottom: 1px solid #ccc; padding-bottom: 16px;"><h3 style="font-size: 13px; font-weight: 700; margin-bottom: 8px;">Contactgegevens</h3><table style="width: 100%; font-size: 12px; line-height: 1.8;">
    ${huurders.map((h, i) => `<tr><td style="font-weight:600;vertical-align:top;white-space:nowrap;">${huurders.length > 1 ? `Huurder ${i+1}:` : 'Huurder:'}</td><td>${renderPartij(h)}</td></tr>`).join('')}
    ${verhuurders.map((v, i) => `<tr><td style="font-weight:600;vertical-align:top;white-space:nowrap;">${verhuurders.length > 1 ? `Verhuurder ${i+1}:` : 'Verhuurder:'}</td><td>${renderPartij(v)}</td></tr>`).join('')}
    ${APP.dossier.contract.datumOndertekening || APP.dossier.contract.datumIngang ? `<tr><td style="font-weight: 600;">Contract:</td><td>${APP.dossier.contract.datumOndertekening ? `Ondertekend: ${formatDate(APP.dossier.contract.datumOndertekening)}` : ''}${APP.dossier.contract.datumOndertekening && APP.dossier.contract.datumIngang ? ' · ' : ''}${APP.dossier.contract.datumIngang ? `Ingang: ${formatDate(APP.dossier.contract.datumIngang)}` : ''}</td></tr>` : ''}
  </table></div>`;
  // Algemene interieurelementen
  const algMet = (APP.interieur?.algemeenheden || []).filter(a => a.beschrijving);
  if (algMet.length > 0 || APP.interieur?.opmerkingen) {
    html += `<div class="report-room"><div class="report-room-title">Algemeen Interieur</div>`;
    if (APP.interieur.opmerkingen) html += `<p style="font-size:13px;font-style:italic;margin-bottom:8px;">${APP.interieur.opmerkingen}</p>`;
    algMet.forEach(a => {
      const bullets = a.beschrijving.split('\n').filter(l=>l.trim()).map(l=>`<li>${l.trim()}</li>`).join('');
      html += `<div class="report-element"><span class="report-element-name">${a.naam}</span>${bullets?`<ul class="report-bullets">${bullets}</ul>`:''}</div>`;
    });
    html += `</div>`;
  }
  APP.kamers.forEach(kamer => {
    const elementsWithContent = ELEMENTEN.filter(e => { const el = kamer.data[e]; return el.geen || el.beschrijving || el.fotos.length > 0; });
    if (elementsWithContent.length === 0) return;
    html += `<div class="report-room"><div class="report-room-title">${kamer.naam}</div>`;
    elementsWithContent.forEach(e => {
      const el = kamer.data[e];
      const fotoNrs = el.fotos.map(f => f.nr).join(', ');
      const bullets = el.beschrijving ? el.beschrijving.split('\n').filter(l => l.trim()).map(l => `<li>${l.trim()}</li>`).join('') : '';
      html += `<div class="report-element"><span class="report-element-name">${e}</span>${fotoNrs ? `<span class="report-photos">Foto's: ${fotoNrs}</span>` : ''}`;
      if (el.geen) html += `<div class="report-no-comment">Geen opmerkingen</div>`;
      else if (bullets) html += `<ul class="report-bullets">${bullets}</ul>`;
      html += `</div>`;
    });
    html += `</div>`;
  });
  APP.kamers.forEach(kamer => {
    const allPhotos = [];
    ELEMENTEN.forEach(e => { if (kamer.data[e].fotos.length > 0) kamer.data[e].fotos.forEach(f => allPhotos.push({...f, element: e})); });
    if (allPhotos.length === 0) return;
    html += `<div style="margin-top: 24px;"><div style="font-size: 14px; font-weight: 700; border-bottom: 1px solid #ccc; padding-bottom: 3px; margin: 12px 0;">Foto's ${kamer.naam}</div><div class="report-photo-grid">${allPhotos.map(f => `<div class="report-photo-item"><img src="${f.src}"><div class="report-photo-caption">${f.nr}. Interieur – ${kamer.naam} – ${f.element}${f.note ? `<br><em>${f.note}</em>` : ''}</div></div>`).join('')}</div></div>`;
  });
  html += `</div>`;

  // Sleutels sectie
  const sleutelsItems = APP.sleutels?.items || [];
  const sleutelsOpm = APP.sleutels?.opmerkingen || '';
  const sleutelsFotos = APP.sleutels?.fotos || [];
  if (sleutelsItems.length > 0 || sleutelsOpm || sleutelsFotos.length > 0) {
    html += `<div style="margin-bottom:20px;border-bottom:1px solid #ccc;padding-bottom:16px;">
      <h3 style="font-size:13px;font-weight:700;margin-bottom:8px;">Sleutels</h3>
      ${sleutelsOpm ? `<p style="font-size:12px;margin-bottom:8px;font-style:italic;">${sleutelsOpm}</p>` : ''}
      ${sleutelsItems.length > 0 ? `<table style="width:100%;font-size:12px;line-height:1.8;border-collapse:collapse;margin-bottom:10px;">
        <tr style="font-weight:600;border-bottom:1px solid #eee;"><td style="padding:3px 8px 3px 0;">Type</td><td style="padding:3px 8px 3px 0;">Aantal</td><td style="padding:3px 8px 3px 0;">Opmerkingen</td></tr>
        ${sleutelsItems.map(s => `<tr>
          <td style="padding:3px 8px 3px 0;font-weight:600;">${s.naam}</td>
          <td style="padding:3px 8px 3px 0;">${s.aantal}</td>
          <td style="padding:3px 8px 3px 0;font-style:italic;color:#555;">${s.opmerkingen||''}</td>
        </tr>`).join('')}
      </table>` : ''}
      ${sleutelsFotos.length > 0 ? `<div class="report-photo-grid" style="margin-top:8px;">${sleutelsFotos.map(f=>`<div class="report-photo-item"><img src="${f.src}"><div class="report-photo-caption">${f.nr}. Sleutels${f.note?`<br><em>${f.note}</em>`:''}</div></div>`).join('')}</div>` : ''}
      ${sleutelsItems.filter(s=>s.fotos.length>0).map(s=>`<div style="margin-top:10px;"><div style="font-size:11px;font-weight:700;margin-bottom:4px;">${s.naam}</div><div class="report-photo-grid">${s.fotos.map(f=>`<div class="report-photo-item"><img src="${f.src}"><div class="report-photo-caption">${f.nr}. ${s.naam}${f.note?`<br><em>${f.note}</em>`:''}</div></div>`).join('')}</div></div>`).join('')}
    </div>`;
  }

  // Meters sectie
  const metersItems = APP.meters?.items || [];
  const metersOpm = APP.meters?.opmerkingen || '';
  const metersFotos = APP.meters?.fotos || [];
  if (metersItems.length > 0 || metersOpm || metersFotos.length > 0) {
    html += `<div style="margin-bottom:20px;border-bottom:1px solid #ccc;padding-bottom:16px;">
      <h3 style="font-size:13px;font-weight:700;margin-bottom:8px;">Meterstanden</h3>
      ${metersOpm ? `<p style="font-size:12px;margin-bottom:8px;font-style:italic;">${metersOpm}</p>` : ''}
      ${metersItems.length > 0 ? `<table style="width:100%;font-size:12px;line-height:1.8;border-collapse:collapse;margin-bottom:10px;">
        <tr style="font-weight:600;border-bottom:1px solid #eee;">
          <td style="padding:3px 8px 3px 0;">Type</td>
          <td style="padding:3px 8px 3px 0;">Meternr.</td>
          <td style="padding:3px 8px 3px 0;">Stand</td>
          <td style="padding:3px 8px 3px 0;font-size:10px;">EAN</td>
        </tr>
        ${metersItems.map(m => {
          const isDigitaal = m.obis_181 !== null;
          const isDagNacht = m.stand_dag !== null;
          let stand = '';
          if (isDagNacht) stand = `Dag: ${m.stand_dag||'–'} / Nacht: ${m.stand_nacht||'–'}`;
          else if (isDigitaal) stand = [
            m.obis_181 ? `1.8.1: ${m.obis_181}` : '',
            m.obis_182 ? `1.8.2: ${m.obis_182}` : '',
            m.obis_281 ? `2.8.1: ${m.obis_281}` : '',
            m.obis_282 ? `2.8.2: ${m.obis_282}` : '',
          ].filter(Boolean).join(' · ') || '–';
          else stand = m.stand || '';
          return `<tr>
            <td style="padding:3px 8px 3px 0;font-weight:600;">${m.icon} ${m.naam}</td>
            <td style="padding:3px 8px 3px 0;">${m.nummer||''}</td>
            <td style="padding:3px 8px 3px 0;">${stand}</td>
            <td style="padding:3px 8px 3px 0;font-size:10px;">${m.ean||''}</td>
          </tr>
          `;
        }).join('')}
      </table>` : ''}
      ${metersFotos.length > 0 ? `<div class="report-photo-grid" style="margin-top:8px;">${metersFotos.map(f=>`<div class="report-photo-item"><img src="${f.src}"><div class="report-photo-caption">${f.nr}. Meters${f.note?`<br><em>${f.note}</em>`:''}</div></div>`).join('')}</div>` : ''}
      ${metersItems.filter(m=>m.fotos.length>0).map(m=>`<div style="margin-top:10px;"><div style="font-size:11px;font-weight:700;margin-bottom:4px;">${m.naam}</div><div class="report-photo-grid">${m.fotos.map(f=>`<div class="report-photo-item"><img src="${f.src}"><div class="report-photo-caption">${f.nr}. ${m.naam}${f.note?`<br><em>${f.note}</em>`:''}</div></div>`).join('')}</div></div>`).join('')}
    </div>`;
  }

  document.getElementById('main').innerHTML = html;
}

              <div>
                <div style="font-weight:500;">${item.naam}</div>
                ${item.fotos?.length > 0 ? `<div style="font-size:12px;color:#888;">${item.fotos.length} foto${item.fotos.length>1?"'s":''}</div>` : ''}

              <div class="element-status">
                <div class="status-dot${isFilled?' filled':''}"></div>
                <button onclick="event.stopPropagation();deleteExterieurItem(${idx});" style="background:none;border:none;color:#ccc;font-size:18px;cursor:pointer;padding:4px 8px;">×</button>
              </div>
            </div>`;
          }).join('')}

        <button class="btn btn-secondary" onclick="showAddExterieurModal();" style="width:100%;margin-top:12px;justify-content:center;">+ Element toevoegen</button>

function triggerExterieurCamera() { _triggerCameraFor(addExterieurFotos); }
function addExterieurFotos(files) {
  if (!APP.exterieur.fotos) APP.exterieur.fotos = [];
  Array.from(files).forEach(file => {
    const reader = new FileReader();
    reader.onload = e => { APP.exterieur.fotos.push({ src: e.target.result, nr: APP.fotoCounter++, note: '' }); render(); };
    reader.readAsDataURL(file);
  });
}
function deleteExterieurFoto(idx) { APP.exterieur.fotos.splice(idx, 1); render(); }
function openExterieurFotoLightbox(idx) {
  LIGHTBOX_DATA = { type: 'exterieur-overzicht', index: idx };
  const foto = APP.exterieur.fotos[idx];
  document.getElementById('lb-title').textContent = `${foto.nr}. Exterieur`;
  document.getElementById('lb-note-input').value = foto.note || '';
  document.getElementById('lightbox').classList.add('active');
  initLightboxCanvas(foto.src);
}
function deleteExterieurItem(idx) { APP.exterieur.items.splice(idx, 1); render(); }

function showAddExterieurModal() {
  const bestaande = new Set(APP.exterieur.items.map(i => i.naam));
  const modal = document.createElement('div');
  modal.id = 'ext-modal';
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;';
  modal.innerHTML = `<div style="background:#fff;border-radius:12px;padding:20px;max-width:400px;max-height:85vh;overflow-y:auto;-webkit-overflow-scrolling:touch;">
    <h3 style="font-size:16px;font-weight:700;margin-bottom:16px;">Exterieur element toevoegen</h3>
    <div id="ext-tiles" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;">
      ${EXTERIEUR.map(n => `<div class="tile${bestaande.has(n)?' selected':''}" onclick="toggleExtTile(this,'${n}');" style="padding:12px 6px;font-size:12px;text-align:center;">${n}</div>`).join('')}
    </div>
    <div style="display:flex;gap:8px;margin-bottom:16px;">
      <input id="custom-ext" type="text" placeholder="Eigen naam..." style="flex:1;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:13px;">
      <button class="btn btn-primary" onclick="addCustomExt();" style="padding:10px 16px;">+</button>
    </div>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-secondary" onclick="document.getElementById('ext-modal')?.remove();" style="flex:1;">Annuleer</button>
      <button class="btn btn-primary" onclick="saveExtItems();" style="flex:1;">Klaar</button>
    </div>
  </div>`;
  modal.onclick = e => { if (e.target === modal) modal.remove(); };
  document.body.appendChild(modal);

  const selected = new Set(bestaande);
  window.toggleExtTile = (el, naam) => { if (selected.has(naam)) { selected.delete(naam); el.classList.remove('selected'); } else { selected.add(naam); el.classList.add('selected'); } };
  window.addCustomExt = () => {
    const inp = document.getElementById('custom-ext'); const naam = inp.value.trim(); if (!naam) return;
    selected.add(naam); inp.value = '';
    const t = document.createElement('div'); t.className = 'tile selected'; t.style.cssText = 'padding:12px 6px;font-size:12px;text-align:center;'; t.textContent = naam;
    t.onclick = () => window.toggleExtTile(t, naam); document.getElementById('ext-tiles').appendChild(t);
  };
  window.saveExtItems = () => {
    const bestaandMap = {}; APP.exterieur.items.forEach(i => { bestaandMap[i.naam] = i; });
    APP.exterieur.items = Array.from(selected).map(naam => bestaandMap[naam] || { naam, beschrijving: '', fotos: [] });
    document.getElementById('ext-modal')?.remove(); render();
  };
}

function renderExterieurDetail() {
  const item = APP.exterieur.items[APP.currentExterieur];
  if (!item) { APP.currentScreen = 'exterieur'; render(); return; }
  const prevItem = APP.currentExterieur > 0 ? APP.exterieur.items[APP.currentExterieur-1] : null;
  const nextItem = APP.currentExterieur < APP.exterieur.items.length-1 ? APP.exterieur.items[APP.currentExterieur+1] : null;

  let html = `<div style="max-width:600px;">
    <div style="display:flex;justify-content:space-between;margin-bottom:16px;">
      <button class="btn btn-secondary" onclick="APP.currentExterieur=${APP.currentExterieur-1};render();" ${!prevItem?'disabled':''} style="font-size:13px;">← ${prevItem?.naam||''}</button>
      <button class="btn btn-secondary" onclick="APP.currentExterieur=${APP.currentExterieur+1};render();" ${!nextItem?'disabled':''} style="font-size:13px;">${nextItem?.naam||''} →</button>
    </div>
    <h2 style="font-size:20px;font-weight:700;margin-bottom:16px;">${item.naam}</h2>
    <div class="form-group" style="margin-bottom:20px;">
      <label class="form-label">Beschrijving</label>
      <div id="f-ext-beschr" contenteditable="true"
        style="width:100%;min-height:80px;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;font-family:inherit;outline:none;line-height:1.6;background:#fff;"
        onfocus="this.style.borderColor='#2b2bd4';" onblur="this.style.borderColor='#ddd';saveExtBeschr();"
      >${item.beschrijving ? item.beschrijving.split('\n').filter(l=>l.trim()).map(l=>`<div>• ${l.trim()}</div>`).join('') : '<div><br></div>'}</div>
    </div>
    <label class="form-label">Foto's</label>
    <div id="ext-photo-grid" class="photo-grid" style="margin-top:6px;">${(item.fotos||[]).map((f,i)=>`
      <div class="photo-item">
        <img class="photo-thumb" src="${f.src}" onclick="openExterieurDetailLightbox(${i});">
        <div class="photo-num">${f.nr}</div>
        <button class="photo-del" onclick="deleteExterieurDetailFoto(${i});">×</button>
      </div>`).join('')}</div>
    <div style="margin-top:8px;">
      <button class="btn btn-secondary" onclick="triggerExterieurDetailCamera();" style="cursor:pointer;">📷 Camera</button>
    </div>
  </div>`;

  document.getElementById('main').innerHTML = html;

  const beschr = document.getElementById('f-ext-beschr');
  window.saveExtBeschr = () => {
    const lines = []; beschr.querySelectorAll('div,p').forEach(el => { const t = el.innerText.replace(/^[•·\-]\s*/,'').trim(); if (t) lines.push(t); });
    APP.exterieur.items[APP.currentExterieur].beschrijving = lines.join('\n');
  };
  beschr.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return; e.preventDefault();
    const sel = window.getSelection(); if (!sel.rangeCount) return;
    const range = sel.getRangeAt(0); range.deleteContents();
    const div = document.createElement('div'); div.textContent = '• '; range.insertNode(div);
    const r = document.createRange(); r.setStart(div, div.childNodes.length); r.collapse(true);
    sel.removeAllRanges(); sel.addRange(r);
  });
  beschr.addEventListener('focus', () => {
    if (beschr.innerText.trim() === '') { beschr.innerHTML = '<div>• </div>'; const r = document.createRange(); const d = beschr.querySelector('div'); r.setStart(d.firstChild,2); r.collapse(true); window.getSelection().removeAllRanges(); window.getSelection().addRange(r); }
  });
}

function triggerExterieurDetailCamera() { _triggerCameraFor(addExterieurDetailFotos); }
function addExterieurDetailFotos(files) {
  const item = APP.exterieur.items[APP.currentExterieur];
  if (!item) return;
  if (!item.fotos) item.fotos = [];
  Array.from(files).forEach(file => {
    const reader = new FileReader();
    reader.onload = e => { item.fotos.push({ src: e.target.result, nr: APP.fotoCounter++, note: '' }); render(); };
    reader.readAsDataURL(file);
  });
}
function deleteExterieurDetailFoto(idx) { APP.exterieur.items[APP.currentExterieur].fotos.splice(idx, 1); render(); }
function openExterieurDetailLightbox(idx) {
  const item = APP.exterieur.items[APP.currentExterieur];

}

function showAddMeterModal() {
  const bestaande = new Set(APP.meters.items.map(i => i.naam));

  let html = `<div style="background:#fff;border-radius:12px;padding:20px;max-width:420px;max-height:85vh;overflow-y:auto;-webkit-overflow-scrolling:touch;">
    <h3 style="font-size:16px;font-weight:700;margin-bottom:16px;">Meter toevoegen</h3>
    <div id="meter-add-tiles" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;">
      ${METERS.map(m => `
        <div class="tile${bestaande.has(m.naam)?' selected':''}" data-m="${m.naam}" onclick="toggleMeterTile(this,'${m.naam}');" style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 8px;">
          <div style="font-size:24px;">${m.icon}</div>
          <div style="font-size:11px;font-weight:600;line-height:1.2;text-align:center;">${m.naam}</div>
        </div>`).join('')}
    </div>
    <div style="display:flex;gap:8px;margin-top:4px;">
      <input id="custom-meter" type="text" placeholder="Of eigen naam..." style="flex:1;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:13px;">
      <button class="btn btn-primary" onclick="addCustomMeterItem();" style="padding:10px 16px;font-size:13px;">+</button>
    </div>
    <div style="margin-top:16px;display:flex;gap:10px;">
      <button class="btn btn-secondary" onclick="document.getElementById('meter-add-modal')?.remove();" style="flex:1;">Annuleer</button>
      <button class="btn btn-primary" onclick="saveMeterItems();" style="flex:1;">Klaar</button>
    </div>
  </div>`;

  const modal = document.createElement('div');
  modal.id = 'meter-add-modal';
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;';
  modal.innerHTML = html;
  modal.onclick = e => { if (e.target === modal) modal.remove(); };
  document.body.appendChild(modal);

  const selected = new Set(bestaande);

  window.toggleMeterTile = function(el, naam) {
    if (selected.has(naam)) { selected.delete(naam); el.classList.remove('selected'); }
    else { selected.add(naam); el.classList.add('selected'); }
  };

  window.addCustomMeterItem = function() {
    const input = document.getElementById('custom-meter');
    const naam = input.value.trim();
    if (!naam) return;
    selected.add(naam);
    input.value = '';
    const grid = document.getElementById('meter-add-tiles');
    const t = document.createElement('div');
    t.className = 'tile selected';
    t.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 8px;';
    t.innerHTML = `<div style="font-size:24px;">➕</div><div style="font-size:11px;font-weight:600;line-height:1.2;text-align:center;">${naam}</div>`;
    t.onclick = () => window.toggleMeterTile(t, naam);
    grid.appendChild(t);
  };

  window.saveMeterItems = function() {
    selected.forEach(naam => {
      if (!APP.meters.items.some(i => i.naam === naam)) {
        const meta = METERS.find(m => m.naam === naam) || { icon: '➕' };
        const isDagNacht = naam === 'Elektriciteit (Dag/Nacht)';
        const isDigitaal = naam === 'Elektriciteit Digitaal';
        APP.meters.items.push({
          naam, icon: meta.icon,
          nummer: '', ean: '',
          stand: (isDagNacht || isDigitaal) ? null : '',
          stand_dag:   isDagNacht  ? '' : null,
          stand_nacht: isDagNacht  ? '' : null,
          obis_181: isDigitaal ? '' : null,
          obis_182: isDigitaal ? '' : null,
          obis_281: isDigitaal ? '' : null,
          obis_282: isDigitaal ? '' : null,
          opmerkingen: '', fotos: []
        });
      }
    });
    APP.meters.items = APP.meters.items.filter(i => selected.has(i.naam));
    document.getElementById('meter-add-modal')?.remove();
    render();
  };
}

let _undoStack = [];

function initLightboxCanvas(src) {
  const canvas = document.getElementById('lb-canvas');
  const ctx = canvas.getContext('2d');
  _undoStack = [];
  const img = new Image();
  img.onload = () => {
    const maxW = window.innerWidth - 20;
    const maxH = window.innerHeight - 220;
    const scale = Math.min(maxW / img.width, maxH / img.height);
    canvas.width = Math.round(img.width * scale);
    canvas.height = Math.round(img.height * scale);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    _undoStack = [ctx.getImageData(0, 0, canvas.width, canvas.height)];
    initLightboxDrawing(canvas, ctx);
  };
  img.src = src;
}

function undoLightbox() {
  const canvas = document.getElementById('lb-canvas');
  const ctx = canvas.getContext('2d');
  if (_undoStack.length > 1) {
    _undoStack.pop();
    ctx.putImageData(_undoStack[_undoStack.length - 1], 0, 0);
  }
}

function initLightboxDrawing(canvas, ctx) {
  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return [t.clientX - rect.left, t.clientY - rect.top];
  }

  function draw([x, y]) {
    ctx.beginPath();
    if (DRAWING.tool === 'eraser') {
      ctx.globalCompositeOperation = 'destination-out';
      ctx.lineWidth = 20;
    } else {
      ctx.globalCompositeOperation = 'source-over';
      ctx.strokeStyle = DRAWING.color;
      ctx.lineWidth = DRAWING.tool === 'marker' ? 9 : 2.5;
      ctx.globalAlpha = DRAWING.tool === 'marker' ? 0.45 : 1;
    }
    ctx.moveTo(DRAWING.lastX, DRAWING.lastY);
    ctx.lineTo(x, y);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();
    [DRAWING.lastX, DRAWING.lastY] = [x, y];
  }

  canvas.onmousedown = e => { DRAWING.drawing = true; [DRAWING.lastX, DRAWING.lastY] = getPos(e); };
  canvas.onmousemove = e => { if (DRAWING.drawing) draw(getPos(e)); };
  canvas.onmouseup = () => { DRAWING.drawing = false; ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; _undoStack.push(ctx.getImageData(0,0,canvas.width,canvas.height)); };
  // Remove old touch listeners by replacing with new ones via ontouch* (single assignment)
  canvas.ontouchstart = e => { e.preventDefault(); DRAWING.drawing = true; [DRAWING.lastX, DRAWING.lastY] = getPos(e); };
  canvas.ontouchmove = e => { e.preventDefault(); if (DRAWING.drawing) draw(getPos(e)); };
  canvas.ontouchend = () => { DRAWING.drawing = false; ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; _undoStack.push(ctx.getImageData(0,0,canvas.width,canvas.height)); };
}

function saveDossierJSON() {
  const data = JSON.stringify(APP, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const adres = APP.dossier.adres ? APP.dossier.adres.replace(/[^a-zA-Z0-9]/g,'_') : 'dossier';
  a.href = url;
  a.download = `plaatsbeschrijving_${adres}_${APP.dossier.datum||'nieuw'}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function loadDossierJSON(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const loaded = JSON.parse(e.target.result);
      Object.assign(APP, loaded);
      APP.currentScreen = 'dossier';
      render();
      alert('Dossier geladen: ' + (APP.dossier.adres || '(geen adres)'));
    } catch(err) {
      alert('Fout bij laden: bestand is geen geldig dossier.');
    }
  };
  reader.readAsText(file);
  input.value = '';
}

    if (el) el.classList.toggle('active', t === tab);
  });
  if (tab === 'inspecties') renderDashboard();
  else if (tab === 'facturatie') renderFacturatie();
  else if (tab === 'bedrijf') renderBedrijf();
}

        <div style="background:${bg};border-radius:10px;padding:16px;">
          <div style="font-size:26px;font-weight:700;color:${c};">${v}</div>

          <th style="padding:10px 16px;text-align:left;font-size:11px;font-weight:700;color:#aaa;text-transform:uppercase;">Adres</th>
          <th style="padding:10px 12px;text-align:left;font-size:11px;font-weight:700;color:#aaa;text-transform:uppercase;">Datum</th>
          <th style="padding:10px 12px;text-align:left;font-size:11px;font-weight:700;color:#aaa;text-transform:uppercase;">Status</th>

        </tr></thead>
        <tbody>
          ${dossiers.length === 0 ? `<tr><td colspan="4" style="padding:40px;text-align:center;color:#bbb;">Nog geen dossiers</td></tr>` :
          dossiers.sort((a,b)=>(b.snapshot.datum||'').localeCompare(a.snapshot.datum||'')).map(d=>`
            <tr style="border-bottom:1px solid #f5f5f5;cursor:pointer;" onclick="openDossier('${d.id}');" onmouseover="this.style.background='#f8f8fb'" onmouseout="this.style.background='#fff'">
              <td style="padding:12px 16px;font-weight:600;">${d.snapshot.adres||'—'} <span style="font-size:11px;color:#aaa;">${d.snapshot.postcode||''} ${d.snapshot.gemeente||''}</span></td>
              <td style="padding:12px;color:#888;font-size:12px;">${formatDate(d.snapshot.datum)}</td>
              <td style="padding:12px;" onclick="event.stopPropagation();">
                <select onchange="updateDossierStatus('${d.id}','factuur',this.value);renderFacturatie();"
                  style="border:none;background:${factuurBg[d.status.factuur]||'#f5f5f5'};color:${factuurColor[d.status.factuur]||'#888'};border-radius:8px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer;">
                  <option value="te factureren" ${d.status.factuur==='te factureren'?'selected':''}>Te factureren</option>
                  <option value="verstuurd" ${d.status.factuur==='verstuurd'?'selected':''}>Verstuurd</option>
                  <option value="betaald" ${d.status.factuur==='betaald'?'selected':''}>Betaald</option>

              <td style="padding:12px;" onclick="event.stopPropagation();">

                    onchange="updateDossierStatus('${d.id}','bedrag',this.value);"
                    style="width:80px;border:1px solid #eee;border-radius:6px;padding:4px 8px;font-size:12px;">

    </div>

}

function uploadLogo(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    if (!DASHBOARD.bedrijf) DASHBOARD.bedrijf = {};
    DASHBOARD.bedrijf.logo = e.target.result;
    renderBedrijf();
  };
  reader.readAsDataURL(file);
}

function removeLogo() {
  if (DASHBOARD.bedrijf) DASHBOARD.bedrijf.logo = null;
  renderBedrijf();
}

function saveBedrijf() {
  if (!DASHBOARD.bedrijf) DASHBOARD.bedrijf = {};
  const fields = {
    'b-naam': 'naam', 'b-adres': 'adres', 'b-nr': 'nr',
    'b-postcode': 'postcode', 'b-gemeente': 'gemeente',
    'b-btw': 'btw', 'b-iban': 'iban', 'b-email': 'email',
    'b-fact-naam': 'factNaam', 'b-fact-adres': 'factAdres', 'b-fact-nr': 'factNr',
    'b-fact-postcode': 'factPostcode', 'b-fact-gemeente': 'factGemeente',
    'b-contact-naam': 'contactNaam', 'b-contact-email': 'contactEmail',
    'b-contact-tel': 'contactTel', 'b-contact-locatie': 'contactLocatie',
  };
  Object.entries(fields).forEach(([id, key]) => {
    const el = document.getElementById(id);
    if (el) DASHBOARD.bedrijf[key] = el.value;
  });
}

function renderDashboard() {
  const dossiers = DASHBOARD.dossiers;
  const today = new Date().toISOString().split('T')[0];
  const searchVal = document.getElementById('dash-search')?.value || '';
  const activeFilter = window._dashFilter || 'alle';

  function getDossierStatus(d) {
    if (d.status.factuur === 'betaald' && d.status.verslag === 'goedgekeurd') return 'Voltooid';
    if (d.status.verslag === 'verstuurd' || d.status.factuur === 'verstuurd') return 'In Afwachting';
    if (d.status.uitgevoerd) return 'Uitgevoerd';
    if (d.status.plannedDate) return 'Ingepland';
    return 'Nieuw';
  }
  const statusColor  = { Nieuw:'#6366f1', Ingepland:'#3b82f6', Uitgevoerd:'#8b5cf6', 'In Afwachting':'#f59e0b', Voltooid:'#10b981' };
  const statusBg     = { Nieuw:'#eef2ff', Ingepland:'#dbeafe', Uitgevoerd:'#ede9fe', 'In Afwachting':'#fef3c7', Voltooid:'#d1fae5' };
  const factuurColor = { 'te factureren':'#ef4444', verstuurd:'#f59e0b', betaald:'#10b981' };

  const totaal        = dossiers.length;
  const teFactureren  = dossiers.filter(d => d.status.factuur === 'te factureren').length;
  const openVerslagen = dossiers.filter(d => !d.status.verslag || d.status.verslag === 'concept').length;
  const omzet         = dossiers.filter(d => d.status.factuur === 'betaald').reduce((s,d) => s + (parseFloat(d.status.bedrag)||0), 0);

  // Komende dossiers: gepland in de toekomst, gesorteerd op datum
  const komend = dossiers
    .filter(d => d.status.plannedDate && d.status.plannedDate >= today)
    .sort((a,b) => a.status.plannedDate.localeCompare(b.status.plannedDate))
    .slice(0, 5);

  // Dringende dossiers: deadline verstreken maar niet voltooid
  const dringend = dossiers.filter(d =>
    d.status.plannedDate && d.status.plannedDate < today && getDossierStatus(d) !== 'Voltooid'
  );

  const filters = ['Alle','Nieuw','Ingepland','Uitgevoerd','In Afwachting','Voltooid'];

  const filtered = dossiers
    .filter(d => {
      const q = searchVal.toLowerCase();
      const matchQ = !q || (d.snapshot.adres+d.snapshot.gemeente+d.snapshot.postcode).toLowerCase().includes(q);
      const matchF = activeFilter === 'alle' || getDossierStatus(d).toLowerCase() === activeFilter.toLowerCase();
      return matchQ && matchF;
    })
    .sort((a,b) => (b.snapshot.datum||'').localeCompare(a.snapshot.datum||''));

  let html = `<div style="max-width:1000px;">

    <!-- Header -->
    <div style="margin-bottom:20px;">
      <h1 style="font-size:22px;font-weight:700;color:#1a1a2e;">Inspecties</h1>
    </div>

    <!-- Statistieken -->
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px;">
      ${[
        ['Totaal', totaal, '#2b2bd4', '#eef2ff'],
        ['Te factureren', teFactureren, '#ef4444', '#fff0f0'],
        ['Open verslagen', openVerslagen, '#f59e0b', '#fffbeb'],
        ['Betaald', '€'+omzet.toFixed(0), '#10b981', '#f0fdf4'],
      ].map(([label,val,color,bg]) => `
        <div style="background:${bg};border-radius:10px;padding:14px 16px;">
          <div style="font-size:24px;font-weight:700;color:${color};">${val}</div>
          <div style="font-size:12px;color:#888;margin-top:2px;">${label}</div>
        </div>`).join('')}
    </div>

    <!-- Dringend / komend -->
    ${dringend.length > 0 ? `
    <div style="background:#fff5f5;border:1px solid #fecaca;border-radius:10px;padding:14px 16px;margin-bottom:16px;">
      <div style="font-size:12px;font-weight:700;color:#ef4444;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;">⚠️ Deadline verstreken</div>
      <div style="display:flex;flex-direction:column;gap:6px;">
        ${dringend.map(d => `
          <div style="display:flex;align-items:center;gap:12px;cursor:pointer;" onclick="openDossier('${d.id}');">
            <span style="background:#fecaca;color:#ef4444;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700;white-space:nowrap;">${formatDate(d.status.plannedDate)}${d.status.plannedTime ? ' ' + d.status.plannedTime : ''}</span>
            <span style="font-size:13px;font-weight:600;">${d.snapshot.adres||'(geen adres)'}</span>
            <span style="font-size:12px;color:#888;">${d.snapshot.postcode||''} ${d.snapshot.gemeente||''}</span>
          </div>`).join('')}
      </div>
    </div>` : ''}

    ${komend.length > 0 ? `
    <div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:14px 16px;margin-bottom:16px;">
      <div style="font-size:12px;font-weight:700;color:#3b82f6;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;">📅 Komende bezoeken</div>
      <div style="display:flex;flex-direction:column;gap:6px;">
        ${komend.map(d => `
          <div style="display:flex;align-items:center;gap:12px;cursor:pointer;" onclick="openDossier('${d.id}');">
            <span style="background:#bfdbfe;color:#2b2bd4;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700;white-space:nowrap;">${formatDate(d.status.plannedDate)}${d.status.plannedTime ? ' ' + d.status.plannedTime : ''}</span>
            <span style="font-size:13px;font-weight:600;">${d.snapshot.adres||'(geen adres)'}</span>
            <span style="font-size:12px;color:#888;">${d.snapshot.postcode||''} ${d.snapshot.gemeente||''}</span>
            <span style="margin-left:auto;font-size:11px;background:${statusBg[getDossierStatus(d)]};color:${statusColor[getDossierStatus(d)]};border-radius:6px;padding:2px 8px;font-weight:600;">${getDossierStatus(d)}</span>
          </div>`).join('')}
      </div>
    </div>` : ''}

    <!-- Tabel -->
    <div style="background:#fff;border-radius:10px;border:1px solid #eee;overflow:hidden;">

      <!-- Filters + zoek -->
      <div style="padding:14px 16px;border-bottom:1px solid #f0f0f5;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;">
        <div style="display:flex;gap:2px;">
          ${filters.map(f => {
            const active = activeFilter === f.toLowerCase();
            const count = f === 'Alle' ? dossiers.length : dossiers.filter(d => getDossierStatus(d) === f).length;
            return `<button onclick="window._dashFilter='${f.toLowerCase()}';renderDashboard();"
              style="padding:6px 14px;font-size:12px;font-weight:${active?'700':'500'};color:${active?'#2b2bd4':'#888'};background:${active?'#eef2ff':'none'};border:none;border-radius:6px;cursor:pointer;">
              ${f} <span style="font-size:11px;opacity:.7;">${count}</span>
            </button>`;
          }).join('')}
        </div>
        <input id="dash-search" type="text" placeholder="🔍  Zoeken..." 
          style="padding:7px 12px;border:1px solid #eee;border-radius:8px;font-size:13px;width:220px;"
          oninput="renderDashboard();" value="${searchVal}">
      </div>

      <!-- Tabelheader -->
      <table style="width:100%;border-collapse:collapse;font-size:13px;">
        <thead>
          <tr style="background:#f8f8fb;border-bottom:1px solid #eee;">
            <th style="padding:10px 16px;text-align:left;font-size:11px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:.5px;">Adres</th>
            <th style="padding:10px 12px;text-align:left;font-size:11px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:.5px;">Gemeente</th>
            <th style="padding:10px 12px;text-align:left;font-size:11px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:.5px;">Type</th>
            <th style="padding:10px 12px;text-align:left;font-size:11px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:.5px;">Datum</th>
            <th style="padding:10px 12px;text-align:left;font-size:11px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:.5px;">Gepland</th>
            <th style="padding:10px 12px;text-align:left;font-size:11px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:.5px;">Status</th>
            <th style="padding:10px 12px;text-align:left;font-size:11px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:.5px;">Factuur</th>
            <th style="padding:10px 12px;text-align:left;font-size:11px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:.5px;">Bedrag</th>
            <th style="padding:10px 8px;"></th>
          </tr>
        </thead>
        <tbody>
          ${filtered.length === 0 ? `
            <tr><td colspan="9" style="padding:40px;text-align:center;color:#bbb;">
              ${dossiers.length === 0 ? `
                <div style="font-size:36px;margin-bottom:8px;">📁</div>
                <div style="font-size:14px;font-weight:600;margin-bottom:12px;">Nog geen inspecties</div>
                <button onclick="createNieuwDossier();" style="background:#2b2bd4;color:#fff;border:none;border-radius:8px;padding:10px 24px;font-size:13px;cursor:pointer;">+ Nieuwe Inspectie</button>
              ` : 'Geen resultaten'}
            </td></tr>
          ` : filtered.map(d => {
            const status = getDossierStatus(d);
            const isLate = d.status.plannedDate && d.status.plannedDate < today && status !== 'Voltooid';
            return `<tr style="border-bottom:1px solid #f5f5f5;cursor:pointer;background:${isLate?'#fff8f8':'#fff'};" 
              onclick="openDossier('${d.id}');"
              onmouseover="this.style.background='#f8f8fb'" 
              onmouseout="this.style.background='${isLate?'#fff8f8':'#fff'}'">
              <td style="padding:12px 16px;font-weight:600;color:#1a1a2e;">${d.snapshot.adres||'—'}</td>
              <td style="padding:12px;color:#555;">${d.snapshot.postcode||''} ${d.snapshot.gemeente||''}</td>
              <td style="padding:12px;color:#888;font-size:12px;">${d.snapshot.type||''}</td>
              <td style="padding:12px;color:#888;font-size:12px;">${formatDate(d.snapshot.datum)}</td>
              <td style="padding:12px;" onclick="event.stopPropagation();">
                <div style="display:flex;gap:4px;align-items:center;">
                  <input type="date" value="${d.status.plannedDate||''}" 
                    onchange="updateDossierStatus('${d.id}','plannedDate',this.value);renderDashboard();"
                    style="border:1px solid #eee;border-radius:6px;padding:3px 6px;font-size:11px;color:${isLate?'#ef4444':'#555'};">
                  <input type="time" value="${d.status.plannedTime||''}"
                    onchange="updateDossierStatus('${d.id}','plannedTime',this.value);"
                    style="border:1px solid #eee;border-radius:6px;padding:3px 6px;font-size:11px;color:#555;width:76px;">
                </div>
              </td>
              <td style="padding:12px;">
                <div style="display:flex;align-items:center;gap:8px;">
                  <span style="background:${statusBg[status]};color:${statusColor[status]};border-radius:6px;padding:3px 10px;font-size:11px;font-weight:700;">${status}</span>
                  ${status === 'Ingepland' || status === 'Uitgevoerd' ? `
                  <label style="display:flex;align-items:center;gap:4px;font-size:11px;color:#888;cursor:pointer;" onclick="event.stopPropagation();">
                    <input type="checkbox" ${d.status.uitgevoerd?'checked':''} onchange="updateDossierStatus('${d.id}','uitgevoerd',this.checked);renderDashboard();" style="cursor:pointer;">
                    Uitgevoerd
                  </label>` : ''}
                </div>
              </td>
              <td style="padding:12px;" onclick="event.stopPropagation();">
                <select onchange="updateDossierStatus('${d.id}','factuur',this.value);renderDashboard();"
                  style="border:1px solid #eee;border-radius:6px;padding:3px 7px;font-size:11px;color:${factuurColor[d.status.factuur]||'#888'};cursor:pointer;background:#fff;">
                  <option value="te factureren" ${d.status.factuur==='te factureren'?'selected':''}>Te factureren</option>
                  <option value="verstuurd" ${d.status.factuur==='verstuurd'?'selected':''}>Verstuurd</option>
                  <option value="betaald" ${d.status.factuur==='betaald'?'selected':''}>Betaald</option>
                </select>
              </td>
              <td style="padding:12px;" onclick="event.stopPropagation();">
                <input type="number" value="${d.status.bedrag||''}" placeholder="0"
                  onchange="updateDossierStatus('${d.id}','bedrag',this.value);"
                  style="width:64px;border:1px solid #eee;border-radius:6px;padding:3px 6px;font-size:11px;">
              </td>
              <td style="padding:12px 8px;" onclick="event.stopPropagation();">
                <button onclick="confirmDeleteDossier('${d.id}');" style="background:none;border:none;color:#ddd;cursor:pointer;padding:4px;border-radius:6px;display:flex;align-items:center;justify-content:center;" onmouseover="this.style.color='#ef4444';this.style.background='#fff0f0'" onmouseout="this.style.color='#ddd';this.style.background='none'">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
                  </svg>
                </button>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  </div>`;

  document.getElementById('main').innerHTML = html;
}

function createNieuwDossier() {
  const id = 'dossier_' + Date.now();
  DASHBOARD.dossiers.push({
    id,
    snapshot: { adres:'', postcode:'', gemeente:'', type:'Intrede', datum: new Date().toISOString().split('T')[0] },
    status: { verslag:'concept', factuur:'te factureren', bedrag:'', plannedDate:'', plannedTime:'', uitgevoerd: false },
    appData: newDossierTemplate(),
  });
  openDossier(id);
}

function openDossier(id) {
  const entry = DASHBOARD.dossiers.find(d => d.id === id);
  if (!entry) return;
  if (_currentDossierId) saveDossierToCurrentEntry();
  _currentDossierId = id;
  Object.assign(APP, JSON.parse(JSON.stringify(entry.appData)));
  APP.currentScreen = 'dossier';
  currentView = 'app';
  render();
}

function saveDossierToDashboard() {
  // Valideer verplichte velden
  const verplicht = [
    { id: 'f-adres',                  label: 'Straat' },
    { id: 'f-pc',                     label: 'Postcode' },
    { id: 'f-gem',                    label: 'Gemeente' },
    { id: 'f-type',                   label: 'Inspectie type' },
    { id: 'f-datum',                  label: 'Datum inspectie' },
    { id: 'f-expert',                 label: 'Expert inspectie' },
    { id: 'f-huurder-naam-0',         label: 'Naam huurder' },
    { id: 'f-huurder-straat-0',       label: 'Straat huurder' },
    { id: 'f-huurder-email-0',        label: 'Email huurder' },
    { id: 'f-verhuurder-naam-0',      label: 'Naam verhuurder' },
    { id: 'f-verhuurder-straat-0',    label: 'Straat verhuurder' },
    { id: 'f-verhuurder-email-0',     label: 'Email verhuurder' },
    { id: 'f-contract-ondertekening', label: 'Huurcontract ondertekend op' },
    { id: 'f-contract-ingang',        label: 'Huurcontract ingang op' },
  ];

  let fouten = [];
  // Reset stijl
  verplicht.forEach(v => {
    const el = document.getElementById(v.id);
    if (el) el.style.borderColor = '';
  });

  verplicht.forEach(v => {
    const el = document.getElementById(v.id);
    if (el && !el.value.trim()) {
      el.style.borderColor = '#ef4444';
      el.style.borderWidth = '1.5px';
      fouten.push(v.label);
    }
  });

  if (fouten.length > 0) {
    // Toon foutmelding
    let err = document.getElementById('dossier-errors');
    if (!err) {
      err = document.createElement('div');
      err.id = 'dossier-errors';
      const btn = document.getElementById('save-dash-btn');
      btn?.parentNode?.insertAdjacentElement('afterend', err);
    }
    err.innerHTML = `<div style="margin-top:12px;background:#fff0f0;border:1px solid #fecaca;border-radius:8px;padding:10px 14px;font-size:13px;color:#ef4444;">
      <strong>Vul volgende velden in:</strong> ${fouten.join(', ')}
    </div>`;
    // Scroll naar eerste fout
    const eerste = document.getElementById(verplicht.find(v => fouten.includes(v.label))?.id);
    eerste?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    eerste?.focus();
    return;
  }

  // Geen fouten — opslaan
  document.getElementById('dossier-errors')?.remove();
  saveDossier();
  saveDossierToCurrentEntry();
  const btn = document.getElementById('save-dash-btn');
  if (btn) {
    const orig = btn.innerHTML;
    btn.innerHTML = '✓ Opgeslagen';
    btn.style.background = '#10b981';
    setTimeout(() => { btn.innerHTML = orig; btn.style.background = ''; }, 1500);
  }
}

function saveDossierToCurrentEntry() {
  if (!_currentDossierId) return;
  const entry = DASHBOARD.dossiers.find(d => d.id === _currentDossierId);
  if (!entry) return;
  entry.appData = JSON.parse(JSON.stringify(APP));
  entry.snapshot = { adres: APP.dossier.adres + (APP.dossier.nr ? ' ' + APP.dossier.nr : '') + (APP.dossier.bus ? ' bus ' + APP.dossier.bus : ''), postcode: APP.dossier.postcode, gemeente: APP.dossier.gemeente, type: APP.dossier.type, datum: APP.dossier.datum };
}

function updateDossierStatus(id, field, value) {
  const entry = DASHBOARD.dossiers.find(d => d.id === id);
  if (entry) entry.status[field] = value;
}

function confirmDeleteDossier(id) {
  const entry = DASHBOARD.dossiers.find(d => d.id === id);
  const adres = entry?.snapshot?.adres || '(geen adres)';
  const modal = document.createElement('div');
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;';
  modal.innerHTML = `<div style="background:#fff;border-radius:12px;padding:24px;max-width:360px;width:100%;box-shadow:0 8px 32px rgba(0,0,0,.2);">
    <h3 style="font-size:16px;font-weight:700;margin-bottom:8px;color:#1a1a2e;">Dossier verwijderen?</h3>
    <p style="font-size:13px;color:#666;margin-bottom:20px;">"${adres}" wordt permanent verwijderd. Dit kan niet ongedaan worden.</p>
    <div style="display:flex;gap:10px;">
      <button onclick="this.closest('.del-modal').remove();" class="btn btn-secondary" style="flex:1;">Annuleer</button>
      <button onclick="deleteDossier('${id}');this.closest('.del-modal').remove();" style="flex:1;background:#ef4444;color:#fff;border:none;border-radius:8px;padding:10px;font-size:13px;font-weight:600;cursor:pointer;">Verwijderen</button>
    </div>
  </div>`;
  modal.classList.add('del-modal');
  modal.onclick = e => { if (e.target === modal) modal.remove(); };
  document.body.appendChild(modal);
}

function deleteDossier(id) {
  DASHBOARD.dossiers = DASHBOARD.dossiers.filter(d => d.id !== id);
  if (_currentDossierId === id) _currentDossierId = null;
  renderDashboard();
}

function exportDashboardJSON() {
  if (_currentDossierId) saveDossierToCurrentEntry();
  const blob = new Blob([JSON.stringify(DASHBOARD, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `dashboard_${new Date().toISOString().split('T')[0]}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importDashboardJSON(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const loaded = JSON.parse(e.target.result);
      if (loaded.dossiers) {
        DASHBOARD = loaded;
        _currentDossierId = null;
        currentView = 'dashboard';
        render();
      } else {
        // Oud enkel-dossier formaat
        const id = 'dossier_' + Date.now();
        DASHBOARD.dossiers.push({ id, snapshot:{ adres:loaded.dossier?.adres||'', postcode:loaded.dossier?.postcode||'', gemeente:loaded.dossier?.gemeente||'', type:loaded.dossier?.type||'', datum:loaded.dossier?.datum||'' }, status:{verslag:'concept',factuur:'te factureren',bedrag:'',plannedDate:''}, appData:loaded });
        renderDashboard();
      }
    } catch(err) { alert('Fout bij laden.'); }
  };
  reader.readAsText(file);
  input.value = '';
}

render();

document.getElementById('cam-input').addEventListener('change', function() {
  if (!this.files || !this.files.length) return;
  _camPhotoCount++;
  const countEl = document.getElementById('cam-count');
  if (countEl) countEl.textContent = `${_camPhotoCount} foto${_camPhotoCount > 1 ? "'s" : ''} genomen ✓ — tik opnieuw voor meer`;
  const file = this.files[0];
  const reader = new FileReader();
  reader.onload = e => {
    if (APP.currentScreen === 'detail') {
      APP.kamers[APP.currentKamer].data[APP.currentElement].fotos.push({ src: e.target.result, nr: APP.fotoCounter++, note: '' });
      updatePhotoGrid();
    } else if (_cameraCallback) {
      _cameraCallback([file]);
    }
  };
  reader.readAsDataURL(file);
  this.value = '';
});
</script>
